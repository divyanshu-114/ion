schema_version = 1
# Evaluation fallback only; normal TUI launches start with no model selected.
default_profile = "deepseek-direct"
# The evaluator chooses the issuer of AI_API_KEY through /model in the TUI.
evaluation_profiles = ["deepseek-direct", "qwen-direct"]

[economy]
enabled = false
max_requests = 12
max_total_tokens = 24000
inspect_output_tokens = 512
edit_output_tokens = 1024
rewrite_output_tokens = 4096
verify_output_tokens = 512
finalize_output_tokens = 512
verification_reserve_tokens = 256
finalization_reserve_tokens = 256
max_tool_preview_chars = 4000
output_focused_read_page_chars = 12000
compaction_recoveries = 1

[profiles.openrouter-coding-free]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "cohere/north-mini-code:free"
api_key_env = "OPENROUTER_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 256000
input_budget_tokens = 6000
max_output_tokens = 4096

[profiles.groq-qwen-dev]
provider = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "qwen/qwen3.8-27b"
api_key_env = "GROQ_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 131072
max_output_tokens = 4096

[profiles.openrouter-qwen-free]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.8-27b:free"
api_key_env = "OPENROUTER_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 262144
max_output_tokens = 4096

[profiles.openrouter-free-router]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "openrouter/free"
api_key_env = "OPENROUTER_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 200000
max_output_tokens = 4096

[model_catalog]
allow_runtime_discovery = true
cache_ttl_seconds = 300
require_text = true
require_tools = true

[profiles.deepseek-direct]
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 1048576
max_output_tokens = 4096

[profiles.qwen-direct]
provider = "qwen"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 131072
max_output_tokens = 4096
